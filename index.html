<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oman Service</title>
<style>
*{box-sizing:border-box}
:root{--green:#087f5b;--dark:#075b43;--bg:#f3f7f5;--text:#172b25;--muted:#65756e}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5}
header{background:linear-gradient(135deg,#087f5b,#075b43);color:white;padding:30px 20px 28px;border-radius:0 0 25px 25px;box-shadow:0 5px 18px #075b4325}
header h1{font-size:32px;margin:0 0 8px;font-weight:800;letter-spacing:-.5px}
header p{margin:0 0 22px;color:#e2fff2;font-size:17px}
input,select{font:inherit;max-width:100%;padding:14px 15px;border:1px solid #dce6e0;border-radius:12px;background:white;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px #087f5b18}
header input{width:100%;border:0;border-radius:13px;box-shadow:0 3px 12px #003b2820}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px}
h2{font-size:25px;margin:8px 0 20px;letter-spacing:-.4px}
h3{font-size:20px;margin:0 0 14px}
#workerName,#workerPhone,#workerCity{display:block;width:100%!important;margin:10px 0!important;padding:14px!important}
#workerType{display:block;width:100%!important;margin:10px 0 14px!important;padding:14px!important}
button{font:inherit;font-weight:700;background:var(--green);color:white;border:0;border-radius:12px;padding:13px 19px;cursor:pointer;box-shadow:0 4px 10px #087f5b22}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:wait}
#workerList{margin:14px 0 28px}
#workerList>div{background:white;padding:20px;margin:12px 0;border:1px solid #e7eee9;border-radius:17px;box-shadow:0 4px 14px #183b2b08;overflow-wrap:anywhere}
#workerList h3{font-size:19px;margin:0 0 12px;color:#173d30}
#workerList p{color:#52665c;margin:8px 0}
#workerList a{display:inline-block;margin:8px 14px 0 0;color:var(--green);font-weight:700;text-decoration:none}
#workerList a:hover{text-decoration:underline}
#contact{border:1px solid #e0eae3;border-radius:16px}
#contact input{width:100%!important}
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.service{background:white;padding:22px 10px;text-align:center;border:1px solid #e5eee8;border-radius:16px;cursor:pointer;font-weight:700;color:#245541;box-shadow:0 3px 12px #183b2b08;transition:background .2s,transform .2s}
.service:hover{background:#e6f5ed;transform:translateY(-2px)}
.service:active{background:#d5eee1}
@media(min-width:600px){header{padding:36px max(24px,calc((100% - 728px)/2))}header h1{font-size:38px}.services{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){header h1{font-size:27px}.services{gap:8px}.service{padding:18px 5px;font-size:14px}main{padding:20px 12px}}
</style>
</head>
<body>
<header>
<h1>Oman Service</h1>
<p>Find workers in Oman</p>
<input id="search" placeholder="Search services..." oninput="searchServices()">
</header>
<main>
<h2>Choose a Service</h2>
<h3>Register as a Worker</h3>
<input id="workerName" placeholder="Your name" style="width:90%;padding:10px;margin:5px 0">
<input id="workerPhone" placeholder="Phone number +968..." style="width:90%;padding:10px;margin:5px 0">
<input id="workerCity" placeholder="City (e.g. Muscat, Seeb, Sohar)" style="width:90%;padding:10px;margin:5px 0">
<select id="workerType" style="width:96%;padding:10px;margin:5px 0">
<option>Electrician</option><option>Plumber</option><option>Driver</option><option>AC Technician</option><option>Cleaning</option><option>Other Services</option>
</select>
<button onclick="registerWorker()">Register Worker</button>
<h3>Available Workers</h3>
<div id="workerList"></div>
<div id="contact" style="display:none;background:white;padding:16px;border-radius:10px;margin-bottom:15px"><h3 id="chosen"></h3><p>Contact a service worker</p><input id="phone" type="tel" placeholder="Worker phone e.g. +968..." style="box-sizing:border-box;width:100%;border:1px solid #ccc"><p><button onclick="callWorker()">Call Worker</button> <button onclick="whatsappWorker()">WhatsApp</button></p></div>
<div class="services">
<div class="service" onclick="openService('Electrician')">Electrician</div>
<div class="service" onclick="openService('Plumber')">Plumber</div>
<div class="service" onclick="openService('Driver')">Driver</div>
<div class="service" onclick="openService('AC Technician')">AC Technician</div>
<div class="service" onclick="openService('Cleaning')">Cleaning</div>
<div class="service" onclick="openService('Other Services')">Other Services</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  'https://akgccscqnnmfdcnrliuw.supabase.co',
  'sb_publishable_vTh846CiHW5K1pya-AqhKw_1yKayC8w'
);

async function renderWorkers(filter='') {
  const list = document.getElementById('workerList');
  list.textContent = 'Loading workers...';

  let query = db.from('workers')
    .select('id,name,phone,type,city')
    .order('id', {ascending: false});

  if (filter) query = query.eq('type', filter);

  const {data, error} = await query;
  list.innerHTML = '';

  if (error) {
    list.textContent = 'Could not load workers: ' + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.textContent = 'No workers registered for this service yet.';
    return;
  }

  data.forEach(w => {
    const card = document.createElement('div');
    card.style.cssText =
      'background:white;padding:12px;margin:8px 0;border-radius:8px';

    const title = document.createElement('h3');
    title.textContent = w.name + ' — ' + w.type;

    const phone = document.createElement('p');
    phone.textContent = w.phone;

    const city = document.createElement('p');
    city.textContent = 'City: ' + (w.city || 'Not specified');

    const call = document.createElement('a');
    call.textContent = 'Call Worker';
    call.href = 'tel:' + w.phone;
    call.style.marginRight = '15px';

    const wa = document.createElement('a');
    wa.textContent = 'WhatsApp';
    wa.href = 'https://wa.me/' + w.phone.replace(/\D/g, '');
    wa.target = '_blank';
    wa.rel = 'noopener';

    card.append(title, phone, city, call, wa);
    list.appendChild(card);
  });
}

async function registerWorker() {
  const name = document.getElementById('workerName').value.trim();
  const phone = document.getElementById('workerPhone').value.trim();
  const type = document.getElementById('workerType').value;
  const city = document.getElementById('workerCity').value.trim();

  if (!name || !phone || !city) {
    alert('Enter your name, phone number and city');
    return;
  }

  const button = document.querySelector(
    'button[onclick="registerWorker()"]'
  );
  button.disabled = true;

  try {
    const {data: existing, error: checkError} = await db
      .from('workers')
      .select('id')
      .eq('phone', phone)
      .limit(1);

    if (checkError) {
      alert('Could not check phone number: ' + checkError.message);
      return;
    }

    if (existing && existing.length > 0) {
      alert('This phone number is already registered.');
      return;
    }

    const {error} = await db.from('workers').insert([
      {name, phone, type, city}
    ]);

    if (error) {
      alert('Registration failed: ' + error.message);
      return;
    }

    document.getElementById('workerName').value = '';
    document.getElementById('workerPhone').value = '';
    document.getElementById('workerCity').value = '';

    await renderWorkers();
    alert('Worker registered successfully!');
  } catch (err) {
    alert('Unexpected error: ' + err.message);
  } finally {
    button.disabled = false;
  }
}

function searchServices() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.service').forEach(item => {
    item.style.display =
      item.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function openService(name) {
  document.getElementById('contact').style.display = 'block';
  document.getElementById('chosen').textContent = name;
  renderWorkers(name);
}

function callWorker() {
  const phone = document.getElementById('phone').value.trim();
  if (!phone) {
    alert('Enter worker phone number first');
    return;
  }
  location.href = 'tel:' + phone;
}

function whatsappWorker() {
  const phone = document.getElementById('phone').value.replace(/\D/g, '');
  if (!phone) {
    alert('Enter worker phone number first');
    return;
  }
  window.open('https://wa.me/' + phone, '_blank', 'noopener');
}

renderWorkers();
</script>
</body>
</html>
